name: CI y Notificación a Telegram

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar hola mundo en Python
        run: python3 hola.py

      - name: Enviar notificación a Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ESTADO: ${{ job.status }}
          REPO: ${{ github.repository }}
          RAMA: ${{ github.ref_name }}
          AUTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MENSAJE="GitHub Actions: $ESTADO
          Repo: $REPO ($RAMA)
          Autor: $AUTOR
          Ver log: $RUN_URL"

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MENSAJE}" > /dev/null
